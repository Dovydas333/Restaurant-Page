      <main class="reservation-page">

    <section class="reservation-header">
        <h2>Reserve a Table</h2>
        <p>Reserve your table quickly and enjoy a great meal with us.</p>
    </section>

    <div class="wrapper contact-layout">

        <div class="contact-image">
            <img src="reservation.jpg"
                 alt="Restaurant dining table"
                 loading="lazy">
        </div>

        <article id="contactform">

            <form action="https://httpbin.org/get" method="get">

                <label for="name">Your Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your full name"
                    required>

                <label for="email">Your Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Your email"
                    required>

                <label for="phone">Your Phone:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Your phone"
                    required>

                <label for="date">Reservation Date:</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    required>

                <label for="time">Reservation Time:</label>
                <input
                    type="time"
                    id="time"
                    name="time"
                    required>

                <label for="guests">Number of Guests:</label>
                <input
                    type="number"
                    id="guests"
                    name="guests"
                    min="1"
                    max="20"
                    placeholder="Number of guests"
                    required>

                <label for="requests">Special Requests:</label>
                <textarea
                    id="requests"
                    name="requests"
                    rows="5"
                    placeholder="Any special requests? (Optional)"></textarea>

                <button class="btn" type="submit">
                    RESERVE TABLE
                </button>

            </form>

        </article>

    </div>

    
</main>
